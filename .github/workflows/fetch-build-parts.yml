name: Fetch Unity build parts

on:
  push:
    paths:
      - .github/workflows/fetch-build-parts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: arena/adc6252d-rnds

      - name: Download split data/wasm parts
        env:
          BASE: https://truffled.lol/f/WxUUCwMfShYbBxsCFUMMChAXDUgOGAgI/Build
        run: |
          set -euo pipefail
          files=""
          for s in aa ab ac ad ae af; do files="$files WebBuild.data.part-$s"; done
          for s in aa ab ac ad ae; do files="$files WebBuild.wasm.part-$s"; done
          mkdir -p Build
          for f in $files; do
            echo "::group::$f"
            curl -sS -D headers.txt -o "Build/$f" -fL --retry 3 --retry-delay 2 \
              -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" \
              "$BASE/$f"
            grep -iE "^(HTTP/|content-type|content-length|access-control|content-encoding|location)" headers.txt || true
            stat -c '%n %s bytes' "Build/$f"
            echo "::endgroup::"
          done
          echo "--- headers for framework.js ---"
          curl -sSI -A "Mozilla/5.0" "$BASE/WebBuild.framework.js" | grep -iE "^(HTTP/|content-type|content-length|access-control|content-encoding)" || true
          echo "--- sanity checks ---"
          head -c 15 Build/WebBuild.data.part-aa | xxd | head -2
          head -c 8 Build/WebBuild.wasm.part-aa | xxd | head -1
          echo "total: $(du -ch Build/*.part-* | tail -1)"

      - name: Commit parts to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Build/WebBuild.*.part-*
          if git diff --cached --quiet; then
            echo "No new parts to commit"
          else
            git commit -m "Add split Unity data/wasm build parts"
            git push origin HEAD:arena/adc6252d-rnds
          fi
